plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def sdkInstrumentationLocalProperties = new Properties()
def rootLocalPropertiesFile = new File(rootProject.projectDir, "local.properties")

if (rootLocalPropertiesFile.exists()) {
    rootLocalPropertiesFile.withInputStream { stream ->
        sdkInstrumentationLocalProperties.load(stream)
    }
}

def resolveSdkInstrumentationConfig = { List<String> propertyKeys, String envKey ->
    for (String propertyKey : propertyKeys) {
        def localValue = sdkInstrumentationLocalProperties.getProperty(propertyKey)
        if (localValue != null && !localValue.trim().isEmpty()) {
            return localValue
        }
    }

    def envValue = System.getenv(envKey)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }

    return ""
}

def sdkInstrumentationAppIdentifier = resolveSdkInstrumentationConfig(["sdk.instrumentation.appIdentifier"], "WHITEBOARD_TEST_APP_IDENTIFIER")
def sdkInstrumentationRoomUuid = resolveSdkInstrumentationConfig(["sdk.instrumentation.roomUuid"], "WHITEBOARD_TEST_ROOM_UUID")
def sdkInstrumentationRoomToken = resolveSdkInstrumentationConfig(["sdk.instrumentation.roomToken"], "WHITEBOARD_TEST_ROOM_TOKEN")

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArgument "whiteboard.test.appIdentifier", sdkInstrumentationAppIdentifier
        testInstrumentationRunnerArgument "whiteboard.test.roomUuid", sdkInstrumentationRoomUuid
        testInstrumentationRunnerArgument "whiteboard.test.roomToken", sdkInstrumentationRoomToken
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            testCoverageEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked"
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    api 'com.github.netless-io:DSBridge-Android:nl_dsb_v3.0.4'

    implementation("androidx.webkit:webkit:1.1.0")
    implementation "androidx.annotation:annotation:1.1.0"
    testImplementation 'org.json:json:20180130'
    testImplementation "junit:junit:${rootProject.jUnitVersion}"
    testImplementation "androidx.test:core:${rootProject.testCoreVersion}"
    testImplementation 'org.mockito:mockito-core:1.10.19'
    androidTestImplementation "androidx.test:core:${rootProject.testCoreVersion}"
    androidTestImplementation 'androidx.test:rules:1.3.0'
    androidTestImplementation "androidx.test:runner:${rootProject.testRunnerVersion}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.extJUnitVersion}"
}

task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    classifier = 'sources'
}

task javadoc(type: Javadoc) {
    failOnError false
    source = android.sourceSets.main.java.sourceFiles
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    classpath += configurations.compile
}

// build a jar with javadoc
task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    archives javadocJar
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.netless-io'
                artifactId = 'whiteboard-android'
            }
        }
    }
}
